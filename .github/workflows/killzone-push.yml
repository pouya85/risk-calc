name: Killzone push

# زمان‌بندی GitHub (schedule) در عمل ۴ تا ۷ ساعت دیر اجرا می‌شد، پس حذف شد.
# حالا cron-job.org سر ساعت (با تایم‌زون لندن/نیویورک) از طریق API این را صدا می‌زند:
#   POST /repos/pouya85/risk-calc/actions/workflows/killzone-push.yml/dispatches
#   {"ref":"main","inputs":{"mode":"london"}}   ← 06:53 Europe/London، دوشنبه تا جمعه
#   {"ref":"main","inputs":{"mode":"ny"}}       ← 08:23 America/New_York، دوشنبه تا جمعه
# اسکریپت خودش تا ۵ دقیقه قبل از شروع Killzone صبر می‌کند.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'test | london | ny'
        default: 'test'

concurrency:
  group: killzone-${{ github.event.inputs.mode }}

jobs:
  push:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
        working-directory: push
      - run: node send.mjs
        working-directory: push
        env:
          MODE: ${{ github.event.inputs.mode }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
